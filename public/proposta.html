<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montar proposta — Branddi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F5F9;--surface:#fff;--surface-2:#F8FAFC;--text:#0F172A;--muted:#475569;--dim:#64748B;
    --accent:#0891B2;--rule:#D8E0E8;--alert:#DC2626;--ok:#15803D;
    --petrol:#002B36;--on-petrol:#fff;--on-petrol-dim:#94A3B8;
    /* Cyan oficial (#0ACFDE) na marca sobre a faixa petrol; --accent fica escuro
       (#0891B2) pro texto ter contraste em fundo claro — ver render-proposta.js. */
    --logo-fill:#FFFFFF;--logo-accent:#0ACFDE;--logo-counter:#001D2E;
    --sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#001721;--surface:#002B36;--surface-2:#00323F;--text:#fff;--muted:#B6C2CF;--dim:#8A97A6;
    --accent:#0ACFDE;--rule:#004052;--alert:#F87171;--ok:#4ADE80;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--muted);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

  header{background:var(--petrol);color:var(--on-petrol);padding:.85rem 1.25rem;display:flex;
    align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .logo{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.5rem}
  .logo .nome.svg{display:flex;align-items:center}
  .logo .sep{color:var(--on-petrol-dim);font-weight:400;font-size:.85rem}

  header .who{font-family:var(--mono);font-size:.7rem;color:var(--on-petrol-dim);text-align:right;line-height:1.5}
  header .who b{color:var(--on-petrol);font-weight:600}

  main{max-width:56rem;margin:0 auto;padding:1.25rem 1rem 8rem;display:flex;flex-direction:column;gap:1rem}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
  .card>h2{margin:0;padding:.7rem 1rem;border-bottom:1px solid var(--rule);font-size:.92rem;
    color:var(--text);font-weight:700;display:flex;align-items:center;gap:.55rem}
  .card>h2 .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:.1rem .3rem;font-weight:700}
  .body{padding:1rem;display:flex;flex-direction:column;gap:.9rem}

  label.f{display:flex;flex-direction:column;gap:.28rem;font-family:var(--mono);font-size:.63rem;
    letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:700}
  input[type=text],input[type=number],select,textarea{
    font:400 .9rem/1.4 var(--sans);color:var(--text);background:var(--surface-2);
    border:1px solid var(--rule);border-radius:3px;padding:.45rem .6rem;width:100%;text-transform:none;letter-spacing:0}
  textarea{resize:vertical;min-height:2.1rem;overflow:hidden;line-height:1.4}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem}
  .hint{font:400 .76rem/1.45 var(--sans);color:var(--dim);text-transform:none;letter-spacing:0}

  .chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip.digitado{cursor:default;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
  .chip.digitado .x{margin-left:.15rem;padding:0 .15rem;border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:1rem;line-height:1}
  .chip.digitado .x:hover{color:var(--alert)}
  input.outro{width:11rem;flex:0 0 auto;padding:.3rem .55rem;font-size:.82rem;border-style:dashed}
  input.outro::placeholder{color:var(--dim)}
  input.outro:focus{border-style:solid;border-color:var(--accent)}
  .opcao{border:1px solid var(--rule);border-radius:3px;padding:.8rem;display:flex;flex-direction:column;gap:.7rem}
  .opcaohead{display:flex;gap:.5rem;align-items:center}
  .opcaohead input.rotulo{flex:1;font-weight:600;text-transform:none;letter-spacing:0}
  .opcaohead button{margin-left:auto}
  .condhead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .condhead .flag{font-family:var(--mono);font-size:.6rem;color:var(--accent);letter-spacing:.05em}
  .condhead button{margin-left:auto;text-transform:none;letter-spacing:0}
  .chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--rule);border-radius:3px;
    padding:.35rem .6rem;font-size:.85rem;color:var(--text);cursor:pointer;background:var(--surface-2);user-select:none}
  .chip:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
  .chip input{margin:0;accent-color:var(--accent)}

  .faixas{border:1px dashed var(--rule);border-radius:3px;padding:.7rem;display:flex;flex-direction:column;gap:.6rem}
  .faixa{display:grid;grid-template-columns:1.8rem 1fr 1fr auto;gap:.5rem;align-items:center}
  .faixa .n{font-family:var(--mono);font-size:.7rem;color:var(--dim)}
  .faixahead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
    font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:700}
  button.mini{font:600 .75rem var(--sans);background:transparent;border:1px solid var(--rule);
    color:var(--muted);border-radius:3px;padding:.3rem .55rem;cursor:pointer}
  button.mini:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button.mini:disabled{opacity:.4;cursor:not-allowed}

  .aviso.info{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .aberturas{margin-top:.35rem;font-family:var(--mono);font-size:.72rem;color:var(--text)}
  .aviso{border-left:3px solid var(--alert);background:color-mix(in srgb,var(--alert) 8%,transparent);
    padding:.6rem .8rem;font-size:.85rem;border-radius:0 3px 3px 0}

  footer.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);
    padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:6}
  .pend{font-size:.82rem;flex:1;min-width:14rem}
  .pend b{color:var(--alert)}
  .pend.ok b{color:var(--ok)}
  .pend b.warn,.pend ul.warn li::marker{color:#B45309}
  @media (prefers-color-scheme:dark){.pend b.warn,.pend ul.warn li::marker{color:#FBBF24}}
  .pend ul.warn{color:var(--muted)}
  .feito{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .feito a{color:var(--accent);font-weight:600;word-break:break-all}
  .pend ul{margin:.25rem 0 0;padding-left:1.1rem;color:var(--dim);font-size:.78rem}
  button.primary{font:700 .9rem var(--sans);background:var(--accent);color:#fff;border:0;border-radius:3px;
    padding:.6rem 1.4rem;cursor:pointer}
  @media (prefers-color-scheme:dark){button.primary{color:#00212B}}
  button.primary:disabled{opacity:.45;cursor:not-allowed}

  #gate{max-width:26rem;margin:5rem auto;text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center}
  .hidden{display:none!important}
  .erro{color:var(--alert);font-size:.85rem}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo"><span class="nome">Branddi</span> <span class="sep">· Proposta</span></div>
  <div class="who" id="who"></div>
</header>

<div id="gate">
  <p>Entre com sua conta <b id="dom">@branddi.com</b> para montar a proposta.</p>
  <div id="gbtn"></div>
  <p class="erro hidden" id="gerro"></p>
</div>

<main id="app" class="hidden"></main>

<footer class="bar hidden" id="bar">
  <div class="pend" id="pend"></div>
  <button class="primary" id="salvar" disabled>Salvar proposta</button>
</footer>

<script>
const DEAL_ID = location.pathname.split('/').filter(Boolean).pop();

/** A lista de sugestões de frente, criada uma vez e reusada por todo campo. */
function datalistFrentes() {
  let dl = document.getElementById('frentes-sugeridas');
  if (dl) return dl;
  dl = el('datalist', { id: 'frentes-sugeridas' });
  (CFG.frentesSugeridas || []).forEach((f) => dl.append(el('option', { value: f })));
  document.body.append(dl);
  return dl;
}
let CFG = null, SEED = null, TOKEN = null;

const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = Object.assign(document.createElement(t), a);
  kids.flat().forEach(k => { if (k == null || k === false) return; n.append(k.nodeType ? k : document.createTextNode(k)); });
  return n;
};
// Tira as tags do texto padrão pra ele caber num campo de formulário.
const semTags = (x) => String(x).replace(/<[^>]+>/g, '');

/**
 * Textarea que nasce com uma linha e cresce com o conteúdo.
 *
 * Campo de texto livre neste formulário quase sempre recebe uma linha — uma
 * marca, uma condição, uma observação curta — e reservar quatro de altura pra
 * isso empurrava o resto da tela pra baixo sem motivo.
 */
function textareaAuto(props = {}) {
    const ta = el('textarea', { rows: 1, ...props });
    const cresce = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
    const antes = ta.oninput;
    ta.oninput = (e) => { if (antes) antes.call(ta, e); cresce(); };
    // scrollHeight só é real depois de o campo estar no documento.
    requestAnimationFrame(cresce);
    ta.cresce = cresce;
    return ta;
}
const brl = n => (n == null || n === '') ? '—'
  : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

const estado = { marcas: '', idioma: 'pt', produtos: new Set(), porProduto: {}, pacotes: [], observacoes: '', obsProposta: '', condicoes: {} };
const vazio = (code) => ({ modalidade: CFG.catalogo.modalidades[code] ? CFG.catalogo.modalidadePadrao : null, canais: new Set(), canaisOutros: [], quantidade: '', preco: '', faixas: [], sobConsulta: false });

// ─── Login ──────────────────────────────────────────────────────────
// O script do Google entra com `async defer`, então pode chegar DEPOIS deste
// bloco rodar. Sem esperar, `google` é undefined e a tela fica no "Entre com
// sua conta" para sempre, sem botão e sem erro visível.
function esperarGoogle(limiteMs = 10000) {
  return new Promise((ok, falhou) => {
    const inicio = Date.now();
    (function tenta() {
      if (window.google && google.accounts && google.accounts.id) return ok();
      if (Date.now() - inicio > limiteMs) return falhou(new Error('timeout'));
      setTimeout(tenta, 50);
    })();
  });
}

async function boot() {
  // Abrir a página sem o número do negócio na URL levaria a um fetch em
  // /form/undefined e a um 404 que não explica nada.
  if (!/^[0-9]+$/.test(DEAL_ID || '')) {
    return falhaGate('Abra pelo link da atividade no card — a URL precisa terminar com o número do negócio.');
  }
  try { CFG = await (await fetch('/api/proposal/config')).json(); }
  catch { return falhaGate('Não consegui falar com o servidor.'); }
  $('#dom').textContent = '@' + CFG.dominio;
  // O logo de verdade, no lugar do nome escrito.
  if (CFG.logo) {
    const alvo = $('#logo .nome');
    if (alvo) { alvo.innerHTML = CFG.logo; alvo.classList.add('svg'); }
  }
  if (!CFG.clientId) return falhaGate('GOOGLE_OAUTH_CLIENT_ID não configurada neste ambiente.');
  try { await esperarGoogle(); }
  catch { return falhaGate('Não consegui carregar o login do Google. Recarregue a página; se persistir, pode ser bloqueador de anúncios.'); }
  google.accounts.id.initialize({ client_id: CFG.clientId, callback: onLogin, hd: CFG.dominio, auto_select: true });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'pt-BR' });
}

function falhaGate(msg) { const e = $('#gerro'); e.textContent = msg; e.classList.remove('hidden'); }

async function onLogin(resp) {
  TOKEN = resp.credential;
  const r = await fetch('/api/proposal/form/' + DEAL_ID, { headers: { Authorization: 'Bearer ' + TOKEN } });
  if (!r.ok) return falhaGate((await r.json().catch(() => ({}))).error || 'Não consegui carregar o negócio.');
  SEED = await r.json();
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#bar').classList.remove('hidden');
  $('#who').append(el('b', {}, SEED.deal.organizacao || SEED.deal.titulo), el('br'), SEED.usuario);
  aplicarSeed();
  render();
}

function aplicarSeed() {
  const a = SEED.anterior && SEED.anterior.spec;
  if (a) {
    // Reabertura: retoma a revisão anterior. Sem isso, corrigir um preço
    // obrigaria a digitar a proposta inteira de novo.
    estado.marcas = (a.marcas || []).join('\n');
    const disp = CFG.catalogo.idiomas.filter(i => i.disponivel).map(i => i.code);
    estado.idioma = disp.includes(a.idioma) ? a.idioma : 'pt';
    // Proposta gravada antes de 18/08/2026 tem um valor fechado só. Vira uma
    // opção cobrindo tudo, pra reabrir sem perder o preço.
    if (Array.isArray(a.pacotes)) {
      const doDeal = new Set(a.produtos || []);
      estado.pacotes = a.pacotes
        // Trava anti-stale na reabertura: pacote de uma versão anterior que cita
        // produto que não está mais no deal (ex.: Golpes) não volta.
        .filter((o) => (o.produtos || []).every((c) => doDeal.has(c)))
        .map((o) => ({
          produtos: new Set(o.produtos || []), extras: (o.extras || []).slice(),
          preco: o.preco == null ? '' : o.preco, rotulo: o.rotulo || '',
        }));
    } else if (Number(a.pacote) > 0) {
      estado.pacotes = [{ produtos: new Set(a.produtos || []), extras: [], preco: a.pacote, rotulo: '' }];
    }
    estado.observacoes = a.observacoes || '';
    estado.obsProposta = a.obsProposta || '';
    estado.condicoes = Object.assign({}, a.condicoes || {});
    (a.produtos || []).forEach(c => estado.produtos.add(c));
    Object.entries(a.porProduto || {}).forEach(([c, p]) => {
      estado.porProduto[c] = Object.assign(vazio(c), p, {
        canais: new Set(p.canais || []),
        canaisOutros: Array.isArray(p.canaisOutros) ? p.canaisOutros.slice() : [],
        quantidade: p.quantidade == null ? '' : p.quantidade,
      });
    });
    return;
  }
  // Primeira vez: só o que o card sabe. Marca vem da organização porque é o
  // caso comum (cliente com uma marca só); quem tem mais acrescenta.
  estado.marcas = SEED.deal.organizacao || '';
  const disponiveis = CFG.catalogo.idiomas.filter(i => i.disponivel).map(i => i.code);
  estado.idioma = disponiveis.includes(SEED.sugestao.idioma) ? SEED.sugestao.idioma : 'pt';
  (SEED.sugestao.produtos || []).forEach(c => { estado.produtos.add(c); estado.porProduto[c] = vazio(c); });
}

// ─── Render ─────────────────────────────────────────────────────────
function render() {
  const app = $('#app');
  app.textContent = '';

  if (SEED.anterior) {
    const box = el('div', { className: 'aviso info' });
    box.append(el('div', {}, 'Este negócio já teve ' + SEED.anterior.revisao +
      (SEED.anterior.revisao === 1 ? ' proposta' : ' propostas') +
      '. Salvar cria a revisão ' + (SEED.anterior.revisao + 1) + ' — a anterior continua guardada.'));
    // Quantas vezes o cliente abriu. É o que decide se vale ligar ou esperar,
    // e o que o Google Doc nunca disse.
    const ab = SEED.anterior.aberturas;
    if (ab && ab.total > 0) {
      const quando = new Date(ab.ultima).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      box.append(el('div', { className: 'aberturas' },
        '👁 O cliente abriu a proposta ' + ab.total + (ab.total === 1 ? ' vez' : ' vezes') + '. Última: ' + quando + '.'));
    } else if (SEED.anterior.doc_url) {
      box.append(el('div', { className: 'aberturas' }, '👁 Ainda sem registro de abertura pelo cliente.'));
    }
    app.append(box);
  }

  if (SEED.sugestao.semTemplate && SEED.sugestao.semTemplate.length) app.append(el('div', { className: 'aviso' },
    'O card tem ' + SEED.sugestao.semTemplate.join(' e ') + ' em "Serviço oferecido", que não tem modelo de proposta. Esse trecho não sai no documento.'));

  app.append(cardEscopo());
  CFG.catalogo.produtos.filter(p => estado.produtos.has(p.code)).forEach(p => app.append(cardProduto(p)));
  if (estado.produtos.size) app.append(cardPacote());
  app.append(cardCondicoes());
  atualizarPendencias();
}

function cardEscopo() {
  const c = el('div', { className: 'card' }, el('h2', {}, 'Escopo'));
  const b = el('div', { className: 'body' });

  const ta = textareaAuto({ value: estado.marcas, placeholder: 'Uma marca por linha' });
  ta.oninput = () => { estado.marcas = ta.value; atualizarPendencias(); ta.cresce(); };
  b.append(el('label', { className: 'f' }, 'Marcas monitoradas', ta,
    el('span', { className: 'hint' }, 'Vão no texto da proposta. Veio o nome da organização, mas o cliente pode ter mais de uma marca.')));

  const sel = el('select');
  const indisponiveis = [];
  CFG.catalogo.idiomas.forEach(i => {
    if (!i.disponivel) indisponiveis.push(i.label);
    sel.append(el('option', {
      value: i.code, disabled: !i.disponivel,
      textContent: i.label + (i.disponivel ? '' : ' — em preparação'),
      selected: i.code === estado.idioma && i.disponivel,
    }));
  });
  sel.onchange = () => {
    // As condições são mostradas no idioma da proposta. Trocar o idioma tem que
    // redesenhar o cartão, senão o closer edita em português uma proposta que
    // vai sair em inglês.
    estado.idioma = sel.value;
    estado.condicoes = {};
    render();
  };
  b.append(el('label', { className: 'f' }, 'Idioma da proposta', sel,
    indisponiveis.length ? el('span', { className: 'hint' },
      indisponiveis.join(' e ') + ' ainda não tem o texto dos blocos escrito.') : null));

  const chips = el('div', { className: 'chips' });
  CFG.catalogo.produtos.forEach(p => {
    const inp = el('input', { type: 'checkbox', checked: estado.produtos.has(p.code) });
    inp.onchange = () => {
      if (inp.checked) { estado.produtos.add(p.code); if (!estado.porProduto[p.code]) estado.porProduto[p.code] = vazio(p.code); }
      else {
        estado.produtos.delete(p.code);
        // Trava anti-stale: tirou o produto do deal -> descarta o pacote que o
        // continha (um combo antigo não fica pendurado referenciando o que saiu).
        estado.pacotes = estado.pacotes.filter((o) => !o.produtos.has(p.code));
      }
      render();
    };
    chips.append(el('label', { className: 'chip' }, inp, p.label));
  });
  b.append(el('label', { className: 'f' }, 'Serviços contratados', chips));

  c.append(b);
  return c;
}

function cardProduto(p) {
  const st = estado.porProduto[p.code];
  const qtdCfg = CFG.catalogo.quantidades[p.code];
  const c = el('div', { className: 'card' }, el('h2', {}, p.label, el('span', { className: 'tag' }, p.code)));
  const b = el('div', { className: 'body' });

  // BBP não tem modalidade: quem atua nele é o cliente, a Branddi entrega
  // inteligência. Mostrar a escolha ali sugeriria uma diferença que o
  // documento não tem.
  const mods = CFG.catalogo.modalidades[p.code];
  if (mods) {
    const mod = el('div', { className: 'chips' });
    mods.forEach(m => {
      const inp = el('input', { type: 'radio', name: 'mod-' + p.code, checked: st.modalidade === m });
      inp.onchange = () => { st.modalidade = m; };
      mod.append(el('label', { className: 'chip' }, inp, m));
    });
    b.append(el('label', { className: 'f' }, 'Modalidade', mod, el('span', { className: 'hint' },
      'Monitoria observa e reporta. Com Atuação, a Branddi envia o aviso ao infrator e protocola a denúncia. O texto do documento muda conforme a escolha.')));
  }

  const ch = el('div', { className: 'chips' });
  CFG.catalogo.canais[p.code].forEach(o => {
    const inp = el('input', { type: 'checkbox', checked: st.canais.has(o.id) });
    inp.onchange = () => { if (inp.checked) st.canais.add(o.id); else st.canais.delete(o.id); render(); };
    ch.append(el('label', { className: 'chip' }, inp, o.label));
  });
  // Os digitados entram na MESMA fila dos do catálogo, e o campo de digitar é o
  // último item dela. Sem bloco separado: canal é uma coisa só, venha da lista
  // ou do teclado.
  st.canaisOutros.forEach((nome, i) => {
    const rm = el('button', { className: 'x', type: 'button', textContent: '×', title: 'remover' });
    rm.onclick = () => { st.canaisOutros.splice(i, 1); render(); };
    ch.append(el('span', { className: 'chip digitado' }, nome, rm));
  });
  ch.append(campoOutro(st));
  b.append(el('label', { className: 'f' }, 'Canais monitorados', ch,
    el('span', { className: 'hint' }, 'Vazio usa o padrão do produto. Para plataforma fora da lista, digite no campo ao lado — Enter ou vírgula adiciona mais de uma.')));

  // Só App Store muda o formato do documento: sai a linha de palavras-chave e
  // o canal vai pro título. Por isso a quantidade some da tela nesse caso.
  const soAppStore = p.code === 'BB' && st.canais.size === 1 && st.canais.has(CFG.catalogo.canalAppStore);

  const row = el('div', { className: 'row' });
  if (qtdCfg && !soAppStore) {
    const q = el('input', { type: 'number', min: '1', value: st.quantidade });
    q.oninput = () => { st.quantidade = q.value; atualizarPendencias(); };
    row.append(el('label', { className: 'f' }, qtdCfg.rotulo + ' (' + qtdCfg.unidade + ')', q));
  }
  const pr = el('input', { type: 'number', min: '0', step: '100', value: st.preco });
  pr.oninput = () => { st.preco = pr.value; atualizarPendencias(); };
  row.append(el('label', { className: 'f' }, 'Preço mensal (R$)', pr));
  b.append(row);

  if (soAppStore) b.append(el('div', { className: 'hint' },
    'Só App Store: a proposta sai sem a linha de palavras-chave e com o canal no título, como nas duas que o time já enviou.'));

  if (CFG.catalogo.maxFaixas[p.code]) b.append(escada(p.code, st, qtdCfg));

  c.append(b);
  return c;
}

/**
 * O campo de digitar canal, encaixado na fila de chips como último item.
 *
 * Existe porque a lista fixa nunca vai cobrir tudo: as propostas reais do time
 * trazem 18 combinações distintas de plataforma, e obrigar o closer a escolher
 * só o que está cadastrado o faria mandar a proposta errada ou montar à mão.
 */
function campoOutro(st) {
  const inp = el('input', { type: 'text', className: 'outro', placeholder: '+ outro canal' });
  const guarda = () => {
    // Vírgula e ponto e vírgula separam: quem cola uma lista não adiciona um a um.
    const novos = inp.value.split(/[,;]/).map((x) => x.trim()).filter(Boolean)
      .filter((x) => !st.canaisOutros.includes(x));
    if (!novos.length) { inp.value = ''; return; }
    st.canaisOutros.push(...novos);
    render();
  };
  inp.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); guarda(); } };
  inp.onblur = guarda;
  return inp;
}

function escada(code, st, qtdCfg) {
  const max = CFG.catalogo.maxFaixas[code] - 1; // a faixa 1 são a quantidade e o preço acima
  const box = el('div', { className: 'faixas' });

  const add = el('button', { className: 'mini', type: 'button', textContent: '+ faixa' });
  add.disabled = st.faixas.length >= max;
  add.onclick = () => { st.faixas.push({ qtd: '', preco: '' }); render(); };
  box.append(el('div', { className: 'faixahead' }, el('span', {}, 'Escada de preço (opcional)'), add));

  if (!st.faixas.length) box.append(el('div', { className: 'hint' },
    'Sem faixa, sai preço único. Com faixas, o documento lista uma linha por quantidade — "até N ' + (qtdCfg ? qtdCfg.unidade : '') + ': R$ X".'));

  st.faixas.forEach((f, i) => {
    const q = el('input', { type: 'number', min: '1', value: f.qtd, placeholder: 'quantidade' });
    const pv = el('input', { type: 'number', min: '0', step: '100', value: f.preco, placeholder: 'preço' });
    q.oninput = () => { f.qtd = q.value; atualizarPendencias(); };
    pv.oninput = () => { f.preco = pv.value; atualizarPendencias(); };
    const rm = el('button', { className: 'mini', type: 'button', textContent: '×', title: 'remover faixa' });
    rm.onclick = () => { st.faixas.splice(i, 1); render(); };
    box.append(el('div', { className: 'faixa' }, el('span', { className: 'n' }, (i + 2) + 'ª'), q, pv, rm));
  });

  if (code === 'BBP' && st.faixas.length) {
    const inp = el('input', { type: 'checkbox', checked: st.sobConsulta });
    inp.onchange = () => { st.sobConsulta = inp.checked; };
    box.append(el('label', { className: 'chip' }, inp, 'Acrescentar linha final "Sob consulta"'));
  }
  return box;
}

/**
 * Condições comerciais, editáveis. Vêm preenchidas com o padrão da Branddi no
 * idioma escolhido — o closer só toca no que foi negociado.
 *
 * No envio, só vai o que DIFERE do padrão. Assim uma condição não alterada
 * continua sendo a padrão de verdade, e mudar o padrão depois alcança as
 * propostas novas sem ninguém reeditar nada.
 */
function cardCondicoes() {
  const padrao = CFG.condicoes[estado.idioma] || CFG.condicoes.pt;
  const c = el('div', { className: 'card' }, el('h2', {}, 'Condições comerciais'));
  const b = el('div', { className: 'body' });
  b.append(el('div', { className: 'hint' },
    'Já vêm com a condição padrão da Branddi. Altere só o que foi negociado — o que ficar como está sai como padrão.'));

  Object.entries(padrao).forEach(([chave, def]) => {
    // O padrão tem <strong> pra dar ênfase no documento. Isso NÃO vai pra tela:
    // ninguém deveria precisar saber HTML pra editar uma condição comercial.
    // Mostra o texto limpo; se o closer não mexer, o override não é enviado e o
    // documento usa o padrão original — com o negrito no lugar.
    const limpo = semTags(def.valor);
    const atual = estado.condicoes[chave];
    const ta = textareaAuto({ className: 'cond', value: atual == null ? limpo : atual });
    const alterado = () => ta.value.trim() !== limpo.trim();
    const marca = el('span', { className: 'flag' });
    const pinta = () => { marca.textContent = alterado() ? '● negociado' : ''; };
    ta.oninput = () => {
      if (alterado()) estado.condicoes[chave] = ta.value;
      else delete estado.condicoes[chave];
      pinta(); ta.cresce();
    };
    pinta();
    const reset = el('button', { className: 'mini', type: 'button', textContent: 'voltar ao padrão' });
    reset.onclick = () => { ta.value = limpo; delete estado.condicoes[chave]; pinta(); ta.cresce(); };
    b.append(el('label', { className: 'f' },
      el('span', { className: 'condhead' }, el('span', {}, def.rotulo), marca, reset), ta));
  });

  c.append(b);
  return c;
}

/**
 * Opções de pacote. Plural: a proposta pode oferecer mais de uma combinação com
 * preço próprio — "BB + VM por X, os três por Y" — e o cliente escolhe.
 *
 * Cada opção diz o que contém: produtos desta proposta, mais frentes digitadas
 * pra o que não é produto de catálogo. O desconto de cada uma é calculado
 * contra a soma do que ela própria contém, não contra o contrato todo.
 */
function cardPacote() {
  const c = el('div', { className: 'card' }, el('h2', {}, 'Opções de pacote'));
  const b = el('div', { className: 'body' });

  const soma = (o) => [...o.produtos].reduce((t, k) => t + (Number(estado.porProduto[k]?.preco) || 0), 0);

  b.append(el('div', { className: 'hint' },
    'Sem nenhuma opção, o documento lista o preço cheio de cada serviço. Com uma ou mais, ele mostra as combinações e o cliente escolhe.'));

  estado.pacotes.forEach((o, i) => {
    const box = el('div', { className: 'opcao' });

    const cab = el('div', { className: 'opcaohead' });
    const rot = el('input', { type: 'text', value: o.rotulo, placeholder: 'Opção ' + (i + 1), className: 'rotulo' });
    rot.oninput = () => { o.rotulo = rot.value; };
    const rm = el('button', { className: 'mini', type: 'button', textContent: 'remover opção' });
    rm.onclick = () => { estado.pacotes.splice(i, 1); render(); };
    cab.append(rot, rm);
    box.append(cab);

    // o que entra: produtos desta proposta
    const chips = el('div', { className: 'chips' });
    CFG.catalogo.produtos.filter((pr) => estado.produtos.has(pr.code)).forEach((pr) => {
      const inp = el('input', { type: 'checkbox', checked: o.produtos.has(pr.code) });
      inp.onchange = () => { if (inp.checked) o.produtos.add(pr.code); else o.produtos.delete(pr.code); render(); };
      chips.append(el('label', { className: 'chip' }, inp, pr.label));
    });
    // e frentes digitadas, mesmo padrão dos canais
    o.extras.forEach((nome, j) => {
      const x = el('button', { className: 'x', type: 'button', textContent: '×', title: 'remover' });
      x.onclick = () => { o.extras.splice(j, 1); render(); };
      chips.append(el('span', { className: 'chip digitado' }, nome, x));
    });
    datalistFrentes();
    // `list` é propriedade só-leitura em <input> — Object.assign (dentro do el())
    // lança "which has only a getter" e MATA o render aqui, sumindo o pacote e
    // as condições. Vai por setAttribute, que é o jeito certo de ligar a datalist.
    const novo = el('input', { type: 'text', className: 'outro', placeholder: '+ frente (ex.: App Store)',
      autocomplete: 'off' });
    novo.setAttribute('list', 'frentes-sugeridas');
    const guarda = () => {
      const add = novo.value.split(/[,;]/).map((x) => x.trim()).filter(Boolean).filter((x) => !o.extras.includes(x));
      if (!add.length) { novo.value = ''; return; }
      o.extras.push(...add); render();
    };
    novo.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); guarda(); } };
    novo.onblur = guarda;
    chips.append(novo);
    box.append(el('label', { className: 'f' }, 'O que entra', chips,
      el('span', { className: 'hint' }, 'Marque os serviços desta proposta. Para algo fora deles, digite em "+ frente" — há sugestões ao clicar.')));

    const pr = el('input', { type: 'number', min: '0', step: '100', value: o.preco });
    pr.oninput = () => { o.preco = pr.value; atualizarPendencias(); };
    const s0 = soma(o);
    const desc = Number(o.preco) > 0 && s0 > Number(o.preco)
      ? 'economia de ' + brl(s0 - Number(o.preco)) + '/mês'
      : (s0 > 0 ? 'soma dos serviços desta opção: ' + brl(s0) : '');
    box.append(el('label', { className: 'f' }, 'Preço do pacote (R$)', pr,
      desc ? el('span', { className: 'hint' }, desc) : null));

    b.append(box);
  });

  const add = el('button', { className: 'mini', type: 'button', textContent: '+ opção de pacote' });
  add.onclick = () => {
    // Nasce com todos os produtos marcados: é a combinação mais provável, e
    // desmarcar é menos trabalho que marcar de novo.
    estado.pacotes.push({ produtos: new Set(estado.produtos), extras: [], preco: '', rotulo: '' });
    render();
  };
  b.append(add);

  // O que o lead pediu e foi acordado — ISSO SAI no documento, numa linha do
  // escopo. É o que o Victor/Jessica pediram: condição específica do cliente
  // que precisa constar na proposta, não some no meio das internas.
  const tp = textareaAuto({ value: estado.obsProposta, placeholder: 'Ex.: relatórios quinzenais; incluir marca X a partir do 2º mês.' });
  tp.oninput = () => { estado.obsProposta = tp.value; tp.cresce(); };
  b.append(el('label', { className: 'f' }, 'Observações da proposta', tp,
    el('span', { className: 'hint' }, 'SAI no documento, no fim do escopo. Para condições que o cliente pediu e foram acordadas.')));

  const ta = textareaAuto({ value: estado.observacoes, placeholder: 'Só para o time. Não sai no documento.' });
  ta.oninput = () => { estado.observacoes = ta.value; ta.cresce(); };
  b.append(el('label', { className: 'f' }, 'Observações internas', ta,
    el('span', { className: 'hint' }, 'Não sai no documento — anotação do time.')));

  c.append(b);
  return c;
}

// ─── Validação — as mesmas regras que o gerador aplica ──────────────
function pendencias() {
  const p = [];
  if (!estado.marcas.trim()) p.push('Marcas monitoradas');
  if (!estado.produtos.size) p.push('Nenhum serviço marcado');
  for (const code of estado.produtos) {
    const st = estado.porProduto[code];
    const q = CFG.catalogo.quantidades[code];
    const soAppStore = code === 'BB' && st.canais.size === 1 && st.canais.has(CFG.catalogo.canalAppStore);
    if (!(Number(st.preco) > 0)) p.push('Preço ' + code);
    if (q && !soAppStore && !(Number(st.quantidade) > 0)) p.push(q.rotulo + ' ' + code);
    // Faixa pela metade é o erro provável: põe a quantidade e esquece o preço.
    // Gerar assim produziria uma linha sem valor no documento.
    st.faixas.forEach((f, i) => {
      if (!(Number(f.qtd) > 0)) p.push(code + ' faixa ' + (i + 2) + ' — quantidade');
      if (!(Number(f.preco) > 0)) p.push(code + ' faixa ' + (i + 2) + ' — preço');
    });
  }
  // Opção de pacote pela metade: preço sem conteúdo, ou conteúdo sem preço.
  estado.pacotes.forEach((o, i) => {
    const nome = o.rotulo || ('opção ' + (i + 1));
    if (!(Number(o.preco) > 0)) p.push('Preço da ' + nome);
    // Pacote de um item só é o preço do próprio serviço — não é pacote.
    if (o.produtos.size + o.extras.length < 2) p.push(nome + ' precisa de pelo menos dois itens');
  });
  return p;
}

/**
 * Coisas que NÃO bloqueiam, mas que quase sempre são dedo errado.
 *
 * O pacote é o caso real: no primeiro teste saiu R$ 100 com soma de
 * R$ 15.000, e o formulário aceitou calado. Desconto grande existe, então
 * bloquear seria errado — mas passar batido manda o preço errado pro cliente.
 */
function avisos() {
  const a = [];
  estado.pacotes.forEach((o, i) => {
    const nome = o.rotulo || ('Opção ' + (i + 1));
    const soma = [...o.produtos].reduce((t, c) => t + (Number(estado.porProduto[c]?.preco) || 0), 0);
    const pac = Number(o.preco);
    if (!(pac > 0) || soma <= 0) return;
    if (pac > soma) a.push(nome + ' (' + brl(pac) + ') está ACIMA da soma do que ela contém (' + brl(soma) + ').');
    else if (pac === soma) a.push(nome + ' tem o mesmo valor da soma — sem desconto, não é pacote.');
    else if (pac < soma * 0.5) a.push(nome + ' dá ' + Math.round((1 - pac / soma) * 100) + '% de desconto. Confira antes de salvar.');
  });
  for (const code of estado.produtos) {
    if (!estado.porProduto[code].canais.size) a.push('Sem canal marcado em ' + code + ' — a linha não sai no documento.');
  }
  return a;
}

function atualizarPendencias() {
  const p = pendencias();
  const av = avisos();
  const box = $('#pend');
  box.className = 'pend' + (p.length ? '' : ' ok');
  box.textContent = '';
  if (!p.length) box.append(el('b', {}, '✓ Pronto para salvar'));
  else {
    box.append(el('b', {}, 'Falta preencher ' + p.length + (p.length === 1 ? ' campo' : ' campos')));
    box.append(el('ul', {}, p.slice(0, 6).map(x => el('li', {}, x))));
  }
  if (av.length) {
    box.append(el('b', { className: 'warn' }, '⚠ Confira antes de salvar'));
    box.append(el('ul', { className: 'warn' }, av.slice(0, 3).map(x => el('li', {}, x))));
  }
  $('#salvar').disabled = p.length > 0;
}

// ─── Envio ──────────────────────────────────────────────────────────
$('#salvar').onclick = async () => {
  const btn = $('#salvar');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const spec = {
    marcas: estado.marcas.split('\n').map(s => s.trim()).filter(Boolean),
    idioma: estado.idioma,
    produtos: [...estado.produtos],
    porProduto: Object.fromEntries([...estado.produtos].map(c => {
      const s = estado.porProduto[c];
      return [c, {
        modalidade: s.modalidade,
        canais: [...s.canais],
        canaisOutros: s.canaisOutros.slice(),
        quantidade: s.quantidade === '' ? null : Number(s.quantidade),
        preco: Number(s.preco),
        faixas: s.faixas.map(f => ({ qtd: Number(f.qtd), preco: Number(f.preco) })),
        sobConsulta: !!s.sobConsulta,
      }];
    })),
    // Trava anti-stale (cinturão e suspensório): não grava pacote que referencie
    // produto fora dos serviços do deal — evita salvar combo antigo (ex.: Golpes)
    // que não faz mais parte da proposta.
    pacotes: estado.pacotes
      .filter((o) => [...o.produtos].every((c) => estado.produtos.has(c)))
      .map((o) => ({
        produtos: [...o.produtos], extras: o.extras.slice(),
        preco: Number(o.preco), rotulo: o.rotulo.trim() || null,
      })),
    observacoes: estado.observacoes,
    obsProposta: estado.obsProposta,
    // Só o que foi negociado. Chave ausente = condição padrão da Branddi.
    condicoes: estado.condicoes,
  };
  try {
    const r = await fetch('/api/proposal/form/' + DEAL_ID, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ spec }),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
    const { revisao, url, avisos: probs } = await r.json();
    btn.textContent = '✓ Revisão ' + revisao + ' gerada';
    // A proposta tem endereço agora — mostrar o link é o ponto todo. Sem isso
    // o closer teria que voltar ao card pra descobrir se deu certo.
    const box = $('#pend');
    box.className = 'pend ok';
    box.textContent = '';
    box.append(el('div', { className: 'feito' },
      el('b', {}, '✓ Proposta gerada · '),
      el('a', { href: url, target: '_blank', rel: 'noopener', textContent: url })));
    if (probs && probs.length) box.append(el('ul', { className: 'warn' }, probs.map(x => el('li', {}, x))));
    else box.append(el('ul', {}, [el('li', {}, 'Link gravado no card e atividade fechada.')]));
  } catch (e) {
    alert('Não consegui salvar: ' + e.message);
    btn.textContent = 'Salvar proposta'; btn.disabled = false;
  }
};

boot();
</script>
